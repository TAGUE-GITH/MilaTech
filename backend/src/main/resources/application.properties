spring.application.name=milatech
server.port=${PORT:8080}

# Profil actif : "dev" par defaut (H2 en memoire), "prod" en production (PostgreSQL)
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}

spring.jpa.open-in-view=false
# Le schema est cree par les migrations Flyway ; Hibernate verifie seulement qu il correspond aux entites
spring.jpa.hibernate.ddl-auto=validate

# Adresse du site : CORS et liens envoyes par email
app.frontend-url=${FRONTEND_URL:http://localhost:5173}

# JWT : en production, JWT_SECRET doit etre une cle longue et secrete (32 caracteres minimum)
app.jwt.secret=${JWT_SECRET:dev-secret-a-remplacer-en-production-0123456789}
# Jeton valable 12 heures : une journee de travail
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:43200000}

# Premier compte gerant, cree si la base est vide (valeurs saisies chez l hebergeur en production)
app.bootstrap.email=${BOOTSTRAP_EMAIL:}
app.bootstrap.password=${BOOTSTRAP_PASSWORD:}

# Boutique en ligne : frais de livraison a Yaounde en francs CFA (montant a confirmer avec le gerant)
app.shop.delivery-fee=${SHOP_DELIVERY_FEE:1000}

# Emails (Brevo) : sans cle, les emails sont ecrits dans le journal du serveur
app.mail.brevo-api-key=${BREVO_API_KEY:}
app.mail.sender-email=${MAIL_SENDER_EMAIL:no-reply@milatech.local}
app.mail.sender-name=${MAIL_SENDER_NAME:MilaTech}
# Duree de validite d un lien « mot de passe oublie »
app.password-reset.minutes=60

# Demonstration (portfolio) : donnees fictives et comptes publics affiches sur la page de connexion.
# A laisser a false pour la vraie boutique.
app.demo.enabled=${APP_DEMO:false}
# Photos des produits de demonstration telechargees depuis Unsplash au premier demarrage
app.demo.photos=true
