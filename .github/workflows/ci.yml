name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    name: Backend (Java 21, Spring Boot, PostgreSQL)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: milatech
          POSTGRES_USER: milatech
          POSTGRES_PASSWORD: milatech
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U milatech"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    # Les tests tournent sur une vraie base PostgreSQL, comme en production
    env:
      SPRING_PROFILES_ACTIVE: prod
      DATABASE_URL: jdbc:postgresql://localhost:5432/milatech
      DATABASE_USERNAME: milatech
      DATABASE_PASSWORD: milatech
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - run: chmod +x mvnw && ./mvnw -B verify

  frontend:
    name: Frontend (React, TypeScript)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
